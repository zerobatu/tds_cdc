services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cdc_example_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -No -Q "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cdc_example_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      SQL_HOST: sqlserver
      SQL_PORT: "1433"
      SQL_USER: sa
    volumes:
      - ./sqlserver/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sqlserver/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cdc_example_web
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    environment:
      TDS_HOST: sqlserver
      TDS_PORT: "1433"
      TDS_USERNAME: sa
      TDS_PASSWORD: "YourStrong!Passw0rd"
      TDS_DATABASE: cdc_example
      WEB_PORT: "4000"

  listener:
    build:
      context: ../
      dockerfile: example/listener/Dockerfile
    container_name: cdc_example_listener
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      TDS_HOST: sqlserver
      TDS_PORT: "1433"
      TDS_USERNAME: sa
      TDS_PASSWORD: "YourStrong!Passw0rd"
      TDS_DATABASE: cdc_example